[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "four-wheel-localization"
version = "1.0.0"
description = "Sensor fusion and localization robustness experiments for a four-wheel mobile robot under wheel slip and GNSS outages"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "KindlyGentleman"}
]
keywords = [
    "robotics",
    "kalman-filter",
    "sensor-fusion",
    "odometry",
    "skid-steering",
    "gnss",
    "imu",
    "localization"
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "opencv-python>=4.8.0",
    "pillow>=9.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "scienceplots>=2.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
