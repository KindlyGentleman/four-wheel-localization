[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "four-wheel-robot-localization-ekf"
version = "0.1.0"
description = "EKF-based multi-sensor localization for a four-wheel mobile robot under wheel slip and GNSS outages"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Robotics & State Estimation Research Team"}
]
keywords = [
    "robotics",
    "extended-kalman-filter",
    "sensor-fusion",
    "odometry",
    "skid-steering",
    "gnss",
    "imu",
    "state-estimation"
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "scienceplots>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "imageio>=2.30.0",
    "imageio-ffmpeg>=0.4.8"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

