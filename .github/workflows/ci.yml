name: CI - Four-Wheel Localization Verification

on:
  push:
    branches: [main, master, audit-scientific-repair]
  pull_request:
    branches: [main, master]

jobs:
  test-cpu-suite:
    name: CPU Test Suite (${{ matrix.os }} - Py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies (CPU-only, no Open3D)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run dependency smoke check
        run: |
          python -m pytest tests/test_dependencies_smoke.py -v

      - name: Run complete test suite
        run: |
          python -m pytest tests/ -v

      - name: Run hybrid benchmark verification
        run: |
          python realdata.py

      - name: Run quick benchmark
        run: |
          python scripts/run_quick.py
